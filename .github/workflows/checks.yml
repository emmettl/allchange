name: Check All Change
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run check:boundary && npm run typecheck && npm run lint && npm test
      - run: npm run worker:check && npm run worker:build
      - run: npm run build && npm run check:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: allchange-site
          path: dist
          include-hidden-files: true

  e2e:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chromium, browser: chromium }
          - { project: iphone-webkit, browser: webkit }
    env:
      E2E_PREBUILT: '1'
      E2E_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: allchange-site
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: E2E tests
        id: e2e
        env:
          E2E_SUITE: functional
        run: npx playwright test --grep-invert @frame-cadence --project="$E2E_PROJECT" --workers=1
      - name: E2E frame cadence
        if: ${{ !cancelled() && matrix.browser == 'webkit' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        env:
          E2E_SUITE: frame-cadence
        run: npx playwright test --grep @frame-cadence --project="$E2E_PROJECT" --workers=1
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
